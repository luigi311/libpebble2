name: Build
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - .gitignore
      - "*.md"
  pull_request:
    paths-ignore:
      - .gitignore
      - "*.md"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: fitness_tracker-x86_64
          - os: ubuntu-24.04-arm
            name: fitness_tracker-arm64
  
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: "Install dependencies"
        run: uv sync --frozen --all-groups

      - name: "Run tests"
        run: uv run pytest -v

      - name: "Typecheck"
        continue-on-error: true
        run: uv run pytest --ty src/libpebble2
          
      - name: "Build"
        run: uv build
